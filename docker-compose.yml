version: "2.4"

services:
  server:
    container_name: trueconf-server
    image: ${TC_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${PRIMARY_INTERFACE:-0.0.0.0}:8080:80"
      - "${PRIMARY_INTERFACE:-0.0.0.0}:8443:443"
      - "${PRIMARY_INTERFACE:-0.0.0.0}:4307:4307"
    environment:
      - ADMIN_USER=${ADMIN_LOGIN:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-trueconf}
      - DUMP_PATH=/opt/trueconf/server/var/lib/dump
    volumes:
      - ./data:/opt/trueconf/server/var/lib